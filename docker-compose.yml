services:
  postgres:
    image: postgres:16-alpine
    container_name: cold-email-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: cold_email_db
    ports:
      # Mapped to a non-default host port so this container never collides
      # with a Postgres you may already have running on the standard 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cold-email-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cold-email-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/cold_email_db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-http://(localhost|127\.0\.0\.1):\d+}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./free_outbound_agent:/free_outbound_agent:ro
      - ./gmaps-output:/gmaps-output

  celery-worker:
    build: ./backend
    container_name: cold-email-celery-worker
    restart: unless-stopped
    command: celery -A celery_app.celery_app worker --loglevel=info -P threads --concurrency=16
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/cold_email_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./free_outbound_agent:/free_outbound_agent:ro
      - ./gmaps-output:/gmaps-output

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: cold-email-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
